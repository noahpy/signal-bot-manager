{% extends "dashboard/base.html" %}

{% block title %}Chats — Signal Bot{% endblock %}

{% block content %}
<hgroup>
    <h2>Chats</h2>
    <p>Contacts and groups known to the bot.</p>
</hgroup>

<form method="post" action="{% url 'dashboard:chat_sync' %}" hx-post="{% url 'dashboard:chat_sync' %}" hx-target="#chat-table" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit" class="outline">Sync from Signal</button>
</form>

<div id="chat-table">
    {% include "dashboard/partials/chat_list.html" %}
</div>
{% endblock %}
