<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Signal Bot{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph-ext.min.js"></script>
    <style>
        :root { --pico-font-size: 15px; }
        nav { margin-bottom: 1rem; }
        .badge {
            display: inline-block;
            padding: 0.15em 0.5em;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .badge-success { background: var(--pico-color-green-550); color: #fff; }
        .badge-danger { background: var(--pico-color-red-550); color: #fff; }
        .badge-warning { background: var(--pico-color-amber-550); color: #000; }
        .badge-info { background: var(--pico-color-blue-550); color: #fff; }
        .badge-muted { background: var(--pico-color-grey-600); color: #fff; }
        pre.log { max-height: 300px; overflow-y: auto; font-size: 0.8em; }
        .actions { display: flex; gap: 0.5rem; align-items: center; }
        .actions form { margin: 0; }
        .actions button { margin: 0; padding: 0.3em 0.8em; }
        .flash-error { border-left: 4px solid var(--pico-color-red-550); }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>Signal Bot</strong></li>
        </ul>
        <ul>
            <li><a href="{% url 'dashboard:index' %}">Dashboard</a></li>
            <li><a href="{% url 'dashboard:job_list' %}">Jobs</a></li>
            <li><a href="{% url 'dashboard:chat_list' %}">Chats</a></li>
            {% if messages_page %}<li><a href="{% url 'dashboard:message_index' %}">Messages</a></li>{% endif %}
            <li><a href="{% url 'dashboard:link_account' %}">Account</a></li>
            {% if user.is_authenticated %}
            <li><form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button type="submit" class="outline secondary" style="padding:0.2em 0.6em;margin:0">Logout</button></form></li>
            {% endif %}
        </ul>
    </nav>
    <main class="container">
        {% for m in messages %}<article class="flash{% if m.level_tag == 'error' %} flash-error{% endif %}" style="padding:0.6rem 1rem;margin-bottom:1rem;">{{ m }}</article>{% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
