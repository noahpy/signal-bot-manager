{% extends "dashboard/base.html" %}
{% block title %}Login — Signal Bot{% endblock %}
{% block content %}
<article style="max-width: 420px; margin: 2rem auto;">
    <header><strong>Login</strong></header>
    {% if form.errors %}<p><small style="color: var(--pico-del-color);">Wrong username or password.</small></p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label>Username <input type="text" name="username" autofocus required></label>
        <label>Password <input type="password" name="password" required></label>
        <button type="submit">Login</button>
    </form>
</article>
{% endblock %}
